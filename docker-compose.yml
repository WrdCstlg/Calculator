version: '3.8'

services:
  # Python FastAPI Scientific Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantumcalc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - calc-network

  # Next.js Frontend Studio
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantumcalc-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - calc-network

networks:
  calc-network:
    driver: bridge
